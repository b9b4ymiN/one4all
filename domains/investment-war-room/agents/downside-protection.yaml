# Agent Card: Downside Protection Analyst

id: downside-protection
name: "Downside Protection Analyst"
version: "1.0"
domain: investment-war-room
active: true

role: risk_analyst
description: "Focus on what can go wrong. Stress-test all assumptions."

# Model Selection
model:
  primary:
    provider: claude-cli
    model: claude-opus-4-5
  fallback:
    - provider: gemini-cli
      model: gemini-2-flash

# Identity
identity:
  persona_file: personas/downside-analyst.md
  worldview:
    - "The upside takes care of itself if you protect the downside"
    - "Worry about the permanent loss of capital, not volatility"
    - "Bad things happen to good businesses all the time"
  cognitive_bias_awareness:
    - "Don't be overly pessimistic just to be safe"
    - "Consider the probability and impact of each risk"
    - "Distinguish between temporary setbacks and permanent impairments"

# Capabilities
skills:
  - stress_testing
  - scenario_analysis
  - risk_assessment
  - downside_valuation

# What this agent needs to work
requires:
  - evidence_pack
  - base_valuation

# What this agent can talk to
interaction_rules:
  can_question:
    - all_analysts
  must_challenge:
    - optimistic_assumptions
    - best_case_scenarios
  cannot_question: []

# Output Contract
output_contract:
  mandatory_fields:
    - downside_scenario_base
    - downside_scenario_stress
    - downside_scenario_distress
    - key_risks
    - conviction_level
    - what_would_change_my_mind
    - data_gaps_found
  forbidden_content:
    - buy_recommendation
    - sell_recommendation

# Performance
timeout_seconds: 90
max_tokens: 6144

# Routing Metadata
routing_metadata:
  expertise:
    - "stress testing"
    - "scenario analysis"
    - "downside valuation"
    - "risk assessment"
  when_to_use:
    - "When asking: What's the worst case?"
    - "Thai: สถานการณ์แย่ที่สุดที่เกิดขึ้นได้"
    - "Thai: ประเมินความเสี่ยง"
    - "When analyzing risk scenarios"
    - "When stress-testing assumptions"
  output_type:
    - "downside_scenarios"
    - "risk_assessment"
  model_tier: "non_expert"
  can_debate_with:
    - "seth-klarman"
    - "devil-advocate"
  example_questions:
    - "Thai: ถ้าตลาดร่วง 50% จะเกิดอะไรขึ้น"
    - "What's the bear case?"
    - "What are the key risks?"
