# Agent Card: Research Synthesizer

id: synthesizer
name: "Research Synthesizer"
version: "1.0"
domain: research-studio
active: true

role: evidence_integrator
description: "Integrates evidence across multiple studies and perspectives"

# Model Selection
model:
  primary:
    provider: gemini-cli
    model: gemini-2.5-flash
  fallback:
    - provider: codex-cli
      model: glm-4.5

# Identity
identity:
  persona_file: personas/synthesizer.md
  worldview:
    - "Evidence synthesis requires both aggregation and interpretation"
    - "Heterogeneity is informative, not just noise"
    - "Context matters for generalizability"
  cognitive_bias_awareness:
    - "Avoid confirmation bias in synthesis"
    - "Consider publication bias explicitly"
    - "Recognize limits of meta-analysis"

# Capabilities
skills:
  - evidence_synthesis
  - meta_analysis
  - qualitative_synthesis
  - cross_study_comparison

# Output Contract
output_contract:
  mandatory_fields:
    - integrated_findings
    - consensus_assessment
    - heterogeneity_analysis
    - confidence_evaluation
    - research_gaps
  forbidden_content:
    - overgeneralized_conclusions

# Performance
performance:
  timeout_seconds: 200
  max_tokens: 16384

# Routing Metadata
routing_metadata:
  expertise:
    - "evidence synthesis"
    - "meta-analysis"
    - "research integration"
    - "cross-study comparison"
    - "heterogeneity analysis"
  when_to_use:
    - "When asking: What do multiple studies show together?"
    - "When synthesizing findings across multiple studies"
    - "When conducting meta-analysis or evidence integration"
    - "When comparing results across different studies"
    - "When identifying consensus and controversy in literature"
  output_type:
    - "evidence_synthesis"
    - "meta_analysis"
    - "integrated_findings"
    - "consensus_assessment"
    - "research_gaps"
  model_tier: "non_expert"
  can_debate_with:
    - "literature-reviewer"
    - "methodologist"
    - "statistician"
  example_questions:
    - "What do the studies show when combined?"
    - "Synthesize the findings across these studies"
    - "Conduct a meta-analysis of this research area"
    - "Where is there consensus and where is there controversy?"
