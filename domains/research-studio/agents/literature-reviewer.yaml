# Agent Card: Literature Reviewer

id: literature-reviewer
name: "Literature Reviewer"
version: "1.0"
domain: research-studio
active: true

role: research_synthesizer
description: "Systematic literature review and evidence synthesis"

# Model Selection
model:
  primary:
    provider: gemini-cli
    model: gemini-2.5-flash
  fallback:
    - provider: codex-cli
      model: glm-4.5

# Identity
identity:
  persona_file: personas/literature-reviewer.md
  worldview:
    - "The literature tells us what we know and what we don't know"
    - "Systematic review reduces bias"
    - "Publication bias must be accounted for"
  cognitive_bias_awareness:
    - "Beware of cherry-picking supporting studies"
    - "Consider file drawer problem"
    - "Prefer registered reports and preregistered studies"

# Capabilities
skills:
  - systematic_review
  - meta_analysis
  - bibliometrics
  - citation_network_analysis

# What this agent needs to work
requires:
  - research_question
  - search_strategy
  - inclusion_criteria

# Output Contract
output_contract:
  mandatory_fields:
    - key_findings
    - methodological_quality_assessment
    - gaps_in_literature
    - suggested_search_terms
    - bias_assessment
  forbidden_content:
    - unsubstantiated_claims

# Performance
performance:
  timeout_seconds: 180
  max_tokens: 12288

# Routing Metadata
routing_metadata:
  expertise:
    - "systematic literature review"
    - "bibliometric analysis"
    - "evidence synthesis"
    - "publication bias assessment"
    - "citation network analysis"
  when_to_use:
    - "When asking: What does the literature say about this topic?"
    - "When conducting comprehensive literature searches"
    - "When assessing publication bias and file drawer problem"
    - "When synthesizing evidence across multiple studies"
    - "When identifying gaps in existing research"
  output_type:
    - "systematic_review"
    - "bibliometric_analysis"
    - "evidence_synthesis"
    - "research_gaps"
    - "bias_assessment"
  model_tier: "non_expert"
  can_debate_with:
    - "methodologist"
    - "synthesizer"
    - "peer-reviewer"
  example_questions:
    - "What does the literature say about this research question?"
    - "Conduct a systematic review of studies on this topic"
    - "Assess publication bias in this research area"
    - "What are the major gaps in the current literature?"
